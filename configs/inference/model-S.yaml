# configuration file for PDEformer-2-small that is not included in the paper
base_config: configs/inference/model-L.yaml
model:
  graphormer:
    num_encoder_layers: 9
    embed_dim: 512
    ffn_embed_dim: 1024
  inr:
    dim_hidden: 128
  load_ckpt: path/to/your/converted/model-S.pt
  allow_untrained: False
  # PyTorch build expects a converted torch state_dict checkpoint.
