base_config: configs/pretrain/model-L_small-data.yaml

model:
  # Set this to a pretrained model-L PyTorch state dict for real finetuning.
  # Use "none" for a from-scratch pipeline check.
  load_ckpt: model-L.pt

data:
  path: data/allen_cahn2d
  type: single_pde
  num_workers: 0
  num_samples_per_file:
    train: 8
    test: 8
  pde_dag:
    max_n_scalar_nodes: 80
    max_n_function_nodes: 4
    disconn_attn_bias: -inf
  single_pde:
    param_name: allen_cahn2d
    regularize_ratio: 0.
    train: [allen_cahn2d]

train:
  total_batch_size: 1
  num_txyz_samp_pts: 2048
  lr_init: 5.e-6
  epochs: 20
  lr_scheduler:
    type: mstep
    milestones: [10]
    decay: 0.5
    enable_warmup: False

eval:
  total_batch_size: 1
  interval: 5
  plot_num_per_type: 0
  dataset_per_type: 1

record_dir: exp/finetune/allen_cahn2d/model-L
wandb:
  enabled: true
  project: pdeformer-2-finetuning
  name: allen-cahn2d-model-L
  tags: [finetune, allen-cahn2d, reaction-diffusion, model-L, pdeformer-2]
  mode: online
